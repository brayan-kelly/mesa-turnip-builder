# SPDX-License-Identifier: MIT
name: Publish automatic Mesa baseline release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml

permissions:
  contents: write
  actions: write

jobs:
  tag-baseline:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: update Mesa baseline to ') }}"
    runs-on: ubuntu-24.04

    steps:
      - name: Check out merged baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create Mesa release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ vars.RELEASE_GPG_KEY_ID }}
        run: |
          set -Eeuo pipefail
          mesa_tag="$(sed -nE "s/.*\|\| '([^']+)'.*/\1/p" .github/workflows/build.yml)"
          [[ "$mesa_tag" =~ ^mesa-[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if git ls-remote --exit-code origin "refs/tags/$mesa_tag" >/dev/null 2>&1; then
            echo "Release tag $mesa_tag already exists; nothing to publish."
            exit 0
          fi

          : "${RELEASE_GPG_PRIVATE_KEY:?Set the RELEASE_GPG_PRIVATE_KEY Actions secret}"
          : "${RELEASE_GPG_KEY_ID:?Set the RELEASE_GPG_KEY_ID Actions variable}"

          export GNUPGHOME="$RUNNER_TEMP/mesa-release-gnupg"
          install -d -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -s --local-user "$RELEASE_GPG_KEY_ID" "$mesa_tag" \
            "$GITHUB_SHA" -m "release Mesa Turnip $mesa_tag"
          git tag -v "$mesa_tag"
          git push origin "$mesa_tag"

          rm -rf "$GNUPGHOME"
          unset RELEASE_GPG_PRIVATE_KEY
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$mesa_tag"
